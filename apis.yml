aid: frvr
name: FRVR
description: >-
  FRVR is a gaming company that builds and distributes instant, no-download HTML5
  games across channels beyond the app stores — Facebook Instant, Google Play, iOS
  WebView, Samsung, Xiaomi, and web portals. Its developer surface is the FRVR SDK:
  a single JavaScript SDK (with thin wrappers for Unity WebGL exports, Cocos Creator,
  and Construct 3) that integrates ads, in-app purchases, analytics, auth, local and
  cloud storage, social/friends, leaderboards, tournaments, challenges, consent, and
  notifications into a game, then adapts per distribution channel while FRVR's release
  pipeline injects the correct channel bundle at build time. FRVR also operates the
  UpIt no-code game creation tool. Backed by Accel.
