    registry: cdn
    name: frvr-sdk.min.js
    url: https://cdn.frvr.com/sdk/frvr-sdk.min.js
    install: '<script src="https://cdn.frvr.com/sdk/frvr-sdk.min.js"></script>'
    variant: modern (ES2017)
    official: true
  - language: javascript
    registry: cdn
    name: frvr-sdk.es6.min.js
    url: https://docs.frvr.com/reference/downloads/
    install: '<script src="https://cdn.frvr.com/sdk/frvr-sdk.es6.min.js"></script>'
    variant: ES2015 baseline
    official: true
  - language: javascript
    registry: cdn
    name: frvr-sdk.ie.min.js
    url: https://docs.frvr.com/reference/downloads/
    variant: Internet Explorer 11
    official: true
  - language: javascript
    registry: cdn
