generated: '2026-07-19'
method: searched
source: https://docs.frvr.com/reference/downloads/
notes: >-
  FRVR ships a first-party games SDK as a CDN-hosted JavaScript core plus thin
  engine wrappers. It is NOT published to public package registries (npm/PyPI/etc);
  the web SDK loads from cdn.frvr.com and engine plugins are downloaded from the
  docs site. FRVR's release pipeline injects the correct per-channel bundle at
  build time. All artifacts below are first-party (official: true).
packages:
